<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:18px 20px;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);font-size:var(--text-caption)}
.row{display:flex;gap:var(--space-3);align-items:flex-start}
.sw{flex:1;min-width:0}
.chip{height:56px;border-radius:var(--radius-md);border:1px solid rgba(51,65,85,.08)}
.lab{margin-top:var(--space-2);font-size:var(--text-micro);font-weight:var(--weight-semibold);font-variant-numeric:tabular-nums}
.hex{font-size:var(--text-micro);color:var(--color-text-muted);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.eyebrow{font-size:var(--text-eyebrow);letter-spacing:var(--track-eyebrow);text-transform:uppercase;font-weight:var(--weight-semibold);color:var(--color-text-muted)}
</style></head><body><div style="display:flex;gap:var(--space-11);align-items:center">
<div style="display:flex;align-items:center;gap:var(--space-3)">
<span style="width:26px;height:26px;background:var(--color-text);color:var(--color-text-invert);display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-size:15px;font-weight:var(--weight-bold);border-radius:var(--radius-sm)">V</span>
<span style="font-family:var(--font-heading);font-size:17px;font-weight:var(--weight-bold);letter-spacing:-0.01em">Vértice</span>
</div>
<span class="hex">Cuadro 26px, radio 10px, V en 700 blanco sobre --color-text. No se ha dibujado ningún logo: si tienes uno, sustituye el cuadro.</span>
</div></body></html>
