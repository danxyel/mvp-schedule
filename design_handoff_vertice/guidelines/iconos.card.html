<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:18px 20px;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);font-size:var(--text-caption)}
.row{display:flex;gap:var(--space-3);align-items:flex-start}
.sw{flex:1;min-width:0}
.chip{height:56px;border-radius:var(--radius-md);border:1px solid rgba(51,65,85,.08)}
.lab{margin-top:var(--space-2);font-size:var(--text-micro);font-weight:var(--weight-semibold);font-variant-numeric:tabular-nums}
.hex{font-size:var(--text-micro);color:var(--color-text-muted);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.eyebrow{font-size:var(--text-eyebrow);letter-spacing:var(--track-eyebrow);text-transform:uppercase;font-weight:var(--weight-semibold);color:var(--color-text-muted)}
</style></head><body><div style="display:flex;gap:var(--space-11)">
<div style="text-align:center"><div style="font-size:22px;line-height:1;color:var(--color-accent-700)">＋</div><div class="hex" style="margin-top:var(--space-3)">Reservar</div></div><div style="text-align:center"><div style="font-size:22px;line-height:1;color:var(--color-accent-700)">▤</div><div class="hex" style="margin-top:var(--space-3)">Mis reservas</div></div><div style="text-align:center"><div style="font-size:22px;line-height:1;color:var(--color-accent-700)">◇</div><div class="hex" style="margin-top:var(--space-3)">Bonos</div></div><div style="text-align:center"><div style="font-size:22px;line-height:1;color:var(--color-accent-700)">▦</div><div class="hex" style="margin-top:var(--space-3)">Equipo</div></div><div style="text-align:center"><div style="font-size:22px;line-height:1;color:var(--color-accent-700)">‹ ›</div><div class="hex" style="margin-top:var(--space-3)">Mes / semana</div></div>
</div>
<div class="hex" style="margin-top:var(--space-7)">Heredan currentColor y escalan con la tipografía. Nunca emoji, nunca SVG dibujado a mano. Si el set pasa de ~8, sustituir por Phosphor regular.</div></body></html>
