<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:18px 20px;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);font-size:var(--text-caption)}
.row{display:flex;gap:var(--space-3);align-items:flex-start}
.sw{flex:1;min-width:0}
.chip{height:56px;border-radius:var(--radius-md);border:1px solid rgba(51,65,85,.08)}
.lab{margin-top:var(--space-2);font-size:var(--text-micro);font-weight:var(--weight-semibold);font-variant-numeric:tabular-nums}
.hex{font-size:var(--text-micro);color:var(--color-text-muted);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.eyebrow{font-size:var(--text-eyebrow);letter-spacing:var(--track-eyebrow);text-transform:uppercase;font-weight:var(--weight-semibold);color:var(--color-text-muted)}
</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--color-accent-100)"></div><div class="lab">100</div></div><div class="sw"><div class="chip" style="background:var(--color-accent-200)"></div><div class="lab">200</div></div><div class="sw"><div class="chip" style="background:var(--color-accent-300)"></div><div class="lab">300</div></div><div class="sw"><div class="chip" style="background:var(--color-accent-400)"></div><div class="lab">400</div></div><div class="sw"><div class="chip" style="background:var(--color-accent-500)"></div><div class="lab">500</div></div><div class="sw"><div class="chip" style="background:var(--color-accent-600)"></div><div class="lab">600</div></div><div class="sw"><div class="chip" style="background:var(--color-accent-700)"></div><div class="lab">700</div></div><div class="sw"><div class="chip" style="background:var(--color-accent-800)"></div><div class="lab">800</div></div><div class="sw"><div class="chip" style="background:var(--color-accent-900)"></div><div class="lab">900</div></div></div>
<div style="display:flex;gap:var(--space-9);margin-top:var(--space-5)">
<span class="hex">Base #4F46E5 · Student indigo</span>
<span class="hex">100–300 rellenos y bordes · 500 base · 700–900 texto sobre relleno</span>
</div></body></html>
