<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:18px 20px;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);font-size:var(--text-caption)}
.row{display:flex;gap:var(--space-3);align-items:flex-start}
.sw{flex:1;min-width:0}
.chip{height:56px;border-radius:var(--radius-md);border:1px solid rgba(51,65,85,.08)}
.lab{margin-top:var(--space-2);font-size:var(--text-micro);font-weight:var(--weight-semibold);font-variant-numeric:tabular-nums}
.hex{font-size:var(--text-micro);color:var(--color-text-muted);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.eyebrow{font-size:var(--text-eyebrow);letter-spacing:var(--track-eyebrow);text-transform:uppercase;font-weight:var(--weight-semibold);color:var(--color-text-muted)}
</style></head><body><div style="display:flex;gap:var(--space-5);flex-wrap:wrap">
<div><div style="width:78px;height:56px;background:var(--color-surface);border:1px solid var(--color-border-strong);border-radius:var(--radius-pill)"></div><div class="lab">999px</div><div class="hex">botón · chip · etiqueta</div></div><div><div style="width:78px;height:56px;background:var(--color-surface);border:1px solid var(--color-border-strong);border-radius:var(--radius-sm)"></div><div class="lab">10px</div><div class="hex">evento de agenda</div></div><div><div style="width:78px;height:56px;background:var(--color-surface);border:1px solid var(--color-border-strong);border-radius:var(--radius-md)"></div><div class="lab">12px</div><div class="hex">base</div></div><div><div style="width:78px;height:56px;background:var(--color-surface);border:1px solid var(--color-border-strong);border-radius:var(--radius-lg)"></div><div class="lab">14px</div><div class="hex">celda · menú</div></div><div><div style="width:78px;height:56px;background:var(--color-surface);border:1px solid var(--color-border-strong);border-radius:var(--radius-xl)"></div><div class="lab">16px</div><div class="hex">horario · plan</div></div><div><div style="width:78px;height:56px;background:var(--color-surface);border:1px solid var(--color-border-strong);border-radius:var(--radius-2xl)"></div><div class="lab">18px</div><div class="hex">tarjeta · panel</div></div><div><div style="width:78px;height:56px;background:var(--color-surface);border:1px solid var(--color-border-strong);border-radius:var(--radius-frame)"></div><div class="lab">24px</div><div class="hex">marco</div></div>
</div></body></html>
