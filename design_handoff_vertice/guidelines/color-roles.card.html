<!-- @dsCard group="Colors" viewport="700x190" subtitle="Cada color con un solo trabajo asignado" name="Roles semánticos" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:18px 20px;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);font-size:var(--text-caption)}
.row{display:flex;gap:var(--space-3);align-items:flex-start}
.sw{flex:1;min-width:0}
.chip{height:56px;border-radius:var(--radius-md);border:1px solid rgba(51,65,85,.08)}
.lab{margin-top:var(--space-2);font-size:var(--text-micro);font-weight:var(--weight-semibold);font-variant-numeric:tabular-nums}
.hex{font-size:var(--text-micro);color:var(--color-text-muted);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.eyebrow{font-size:var(--text-eyebrow);letter-spacing:var(--track-eyebrow);text-transform:uppercase;font-weight:var(--weight-semibold);color:var(--color-text-muted)}
</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-5)">
<div><div class="chip" style="background:var(--color-bg)"></div><div class="lab">Lienzo</div><div class="hex">#F8FAFC</div></div><div><div class="chip" style="background:var(--color-surface)"></div><div class="lab">Superficie</div><div class="hex">#FFFFFF</div></div><div><div class="chip" style="background:var(--color-text)"></div><div class="lab">Texto</div><div class="hex">#334155</div></div><div><div class="chip" style="background:var(--color-border)"></div><div class="lab">Borde</div><div class="hex">#E2E8F0</div></div><div><div class="chip" style="background:var(--color-accent)"></div><div class="lab">Interacción</div><div class="hex">#4F46E5</div></div><div><div class="chip" style="background:var(--color-accent-2)"></div><div class="lab">Positivo</div><div class="hex">#14B8A6</div></div><div><div class="chip" style="background:var(--color-warn)"></div><div class="lab">Aviso</div><div class="hex">#F59E0B</div></div><div><div class="chip" style="background:var(--color-text-muted)"></div><div class="lab">Secundario</div><div class="hex">#64748B</div></div>
</div></body></html>
