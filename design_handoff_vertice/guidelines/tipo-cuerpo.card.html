<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:18px 20px;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);font-size:var(--text-caption)}
.row{display:flex;gap:var(--space-3);align-items:flex-start}
.sw{flex:1;min-width:0}
.chip{height:56px;border-radius:var(--radius-md);border:1px solid rgba(51,65,85,.08)}
.lab{margin-top:var(--space-2);font-size:var(--text-micro);font-weight:var(--weight-semibold);font-variant-numeric:tabular-nums}
.hex{font-size:var(--text-micro);color:var(--color-text-muted);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.eyebrow{font-size:var(--text-eyebrow);letter-spacing:var(--track-eyebrow);text-transform:uppercase;font-weight:var(--weight-semibold);color:var(--color-text-muted)}
</style></head><body><div style="font-size:var(--text-body);line-height:var(--leading-normal);max-width:var(--width-prose)">Enviamos el comprobante por correo y un recordatorio 2 h antes.</div>
<div style="font-size:var(--text-meta);color:var(--color-text-muted);margin-top:var(--space-4)">Grupo reducido de secundaria y bachillerato · Academia Centro</div>
<div style="font-size:var(--text-caption);color:var(--color-text-muted);margin-top:var(--space-4)">Lugar apartado 10 minutos. Cancelación sin costo hasta 12 h antes.</div>
<div class="hex" style="margin-top:var(--space-5)">Peso 400 · line-height 1.5 en prosa, 1.35 en meta · medida máxima 620px</div></body></html>
