<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:18px 20px;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);font-size:var(--text-caption)}
.row{display:flex;gap:var(--space-3);align-items:flex-start}
.sw{flex:1;min-width:0}
.chip{height:56px;border-radius:var(--radius-md);border:1px solid rgba(51,65,85,.08)}
.lab{margin-top:var(--space-2);font-size:var(--text-micro);font-weight:var(--weight-semibold);font-variant-numeric:tabular-nums}
.hex{font-size:var(--text-micro);color:var(--color-text-muted);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.eyebrow{font-size:var(--text-eyebrow);letter-spacing:var(--track-eyebrow);text-transform:uppercase;font-weight:var(--weight-semibold);color:var(--color-text-muted)}
</style></head><body><div style="display:flex;gap:var(--space-11);align-items:baseline;font-variant-numeric:tabular-nums">
<div><div style="font-family:var(--font-heading);font-size:34px;font-weight:var(--weight-bold)">7</div><div class="eyebrow" style="margin-top:var(--space-1)">clases</div></div><div><div style="font-family:var(--font-heading);font-size:34px;font-weight:var(--weight-bold)">4/6</div><div class="eyebrow" style="margin-top:var(--space-1)">lugares</div></div><div><div style="font-family:var(--font-heading);font-size:34px;font-weight:var(--weight-bold)">$2,720</div><div class="eyebrow" style="margin-top:var(--space-1)">gasto</div></div><div><div style="font-family:var(--font-heading);font-size:34px;font-weight:var(--weight-bold)">7K2M</div><div class="eyebrow" style="margin-top:var(--space-1)">código</div></div><div><div style="font-family:var(--font-heading);font-size:34px;font-weight:var(--weight-bold)">08:42</div><div class="eyebrow" style="margin-top:var(--space-1)">restan</div></div>
</div>
<div class="hex" style="margin-top:var(--space-5)">Sin tabular las cifras bailan al actualizarse. Peso 600–700.</div></body></html>
