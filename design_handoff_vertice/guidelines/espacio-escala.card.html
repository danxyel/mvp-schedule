<!-- @dsCard group="Spacing" viewport="700x150" subtitle="Base 4 con densidad amplia — el aire hace la jerarquía" name="Escala de espacio" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:18px 20px;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);font-size:var(--text-caption)}
.row{display:flex;gap:var(--space-3);align-items:flex-start}
.sw{flex:1;min-width:0}
.chip{height:56px;border-radius:var(--radius-md);border:1px solid rgba(51,65,85,.08)}
.lab{margin-top:var(--space-2);font-size:var(--text-micro);font-weight:var(--weight-semibold);font-variant-numeric:tabular-nums}
.hex{font-size:var(--text-micro);color:var(--color-text-muted);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.eyebrow{font-size:var(--text-eyebrow);letter-spacing:var(--track-eyebrow);text-transform:uppercase;font-weight:var(--weight-semibold);color:var(--color-text-muted)}
</style></head><body><div style="display:flex;gap:var(--space-3);align-items:flex-end">
<div style="text-align:center"><div style="width:22px;height:calc(var(--space-1) * 2);background:var(--color-accent-300);border-radius:var(--radius-sm) var(--radius-sm) 0 0"></div><div class="lab">1</div></div><div style="text-align:center"><div style="width:22px;height:calc(var(--space-2) * 2);background:var(--color-accent-300);border-radius:var(--radius-sm) var(--radius-sm) 0 0"></div><div class="lab">2</div></div><div style="text-align:center"><div style="width:22px;height:calc(var(--space-3) * 2);background:var(--color-accent-300);border-radius:var(--radius-sm) var(--radius-sm) 0 0"></div><div class="lab">3</div></div><div style="text-align:center"><div style="width:22px;height:calc(var(--space-4) * 2);background:var(--color-accent-300);border-radius:var(--radius-sm) var(--radius-sm) 0 0"></div><div class="lab">4</div></div><div style="text-align:center"><div style="width:22px;height:calc(var(--space-5) * 2);background:var(--color-accent-300);border-radius:var(--radius-sm) var(--radius-sm) 0 0"></div><div class="lab">5</div></div><div style="text-align:center"><div style="width:22px;height:calc(var(--space-6) * 2);background:var(--color-accent-300);border-radius:var(--radius-sm) var(--radius-sm) 0 0"></div><div class="lab">6</div></div><div style="text-align:center"><div style="width:22px;height:calc(var(--space-7) * 2);background:var(--color-accent-300);border-radius:var(--radius-sm) var(--radius-sm) 0 0"></div><div class="lab">7</div></div><div style="text-align:center"><div style="width:22px;height:calc(var(--space-8) * 2);background:var(--color-accent-300);border-radius:var(--radius-sm) var(--radius-sm) 0 0"></div><div class="lab">8</div></div><div style="text-align:center"><div style="width:22px;height:calc(var(--space-9) * 2);background:var(--color-accent-300);border-radius:var(--radius-sm) var(--radius-sm) 0 0"></div><div class="lab">9</div></div><div style="text-align:center"><div style="width:22px;height:calc(var(--space-10) * 2);background:var(--color-accent-300);border-radius:var(--radius-sm) var(--radius-sm) 0 0"></div><div class="lab">10</div></div><div style="text-align:center"><div style="width:22px;height:calc(var(--space-11) * 2);background:var(--color-accent-300);border-radius:var(--radius-sm) var(--radius-sm) 0 0"></div><div class="lab">11</div></div><div style="text-align:center"><div style="width:22px;height:calc(var(--space-12) * 2);background:var(--color-accent-300);border-radius:var(--radius-sm) var(--radius-sm) 0 0"></div><div class="lab">12</div></div>
</div>
<div class="hex" style="margin-top:var(--space-5)">4 6 8 10 12 14 16 18 22 26 32 44 px</div></body></html>
